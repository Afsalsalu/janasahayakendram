{% extends "web/home/base.html" %}
{% load static %}
{% block content %}

<style>
    .form-wrap::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url("{% static 'web/file/images/logoSSC-blue.png' %}");
      background-size: 300px;
      background-repeat: no-repeat;
      background-position: center;
      opacity: 0.1; /* Lower the opacity for a more transparent image */
      z-index: 1;
  }

  input {
    width: 65%;
    /* border: 1px saddlebrown; */
    border-radius: 5px;
    height: 40px;
  }
  </style>


<div class="container">
    <div class="py-5"></div>
    <div class="py-5"></div>
    <div class="py-5"></div>
    <div class="container text-center">
        <div class="row justify-content-md-center">
            <div class="col col-lg-2">
                <div class="form-wrap">
                    <form id="razorpay-form" method="POST" action="{% url 'exam:payment_callback' %}">
                        {% csrf_token %}
 
                        <input type="hidden" name="user_registration_id" value="{{ user_registration.id }}">
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>



{% endblock %}
